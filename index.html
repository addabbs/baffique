<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baffique: Path to Enlightenment</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ffffff;
            --overlay-bg: rgba(0, 0, 0, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #111, #222);
        }

        #game-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.8) 100%);
        }

        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        #scroll-display {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .scroll-content {
            background: #111;
            padding: 40px;
            border: 1px solid #333;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,255,255,0.05);
        }

        .scroll-content h2 { font-size: 2rem; margin-bottom: 20px; letter-spacing: 2px; color: #fff; }
        .scroll-content p { font-size: 1.3rem; line-height: 1.6; margin-bottom: 30px; font-style: italic; color: #ccc; }

        button {
            background: transparent;
            border: 1px solid #555;
            color: #fff;
            padding: 12px 30px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover { background: #fff; color: #000; border-color: #fff; }

        #start-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #start-screen h1 {
            font-size: 6rem;
            letter-spacing: 20px;
            margin-bottom: 20px;
            font-weight: 300;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        #start-screen p { font-size: 1.5rem; margin-bottom: 40px; letter-spacing: 5px; color: #666; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-overlay">
            <div id="scroll-display" class="hidden">
                <div class="scroll-content">
                    <h2 id="fact-title">Осколок Истины</h2>
                    <p id="fact-text"></p>
                    <button id="close-scroll">Продолжить путь</button>
                </div>
            </div>
        </div>

        <div id="start-screen">
            <h1>BAFFIQUE</h1>
            <p>Путь к Просвещению</p>
            <button id="start-button">Начать путешествие</button>
        </div>
    </div>

    <script src="js/camera.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/factory.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/player.js"></script>
    <script src="js/world.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
